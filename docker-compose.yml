services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
